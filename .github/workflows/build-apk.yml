name: SzoHid APK erstellen

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Projektdateien erstellen
        run: |
          echo '' | base64 --decode > projekt.zip
          unzip -o projekt.zip
          sed -i 's/androidx.core:core-ktx:1.16.0/androidx.core:core-ktx:1.12.0/' app/build.gradle.kts
      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 8.2 einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2"

      - name: APK erstellen
        run: gradle assembleDebug --stacktrace

      - name: APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: SzoHid-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
